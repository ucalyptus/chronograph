[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronograph"
version = "0.1.0"
description = "Local-first context graph and work-continuity engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chronograph = "chronograph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
