[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronograph"
version = "0.1.0"
description = "Local-first context graph and work-continuity engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "coverage>=7.0",
    "mutmut>=3.3",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
chronograph = "chronograph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["src/chronograph"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.coverage.json]
output = "coverage/coverage.json"

[tool.mutmut]
paths_to_mutate = ["src/chronograph/extractor.py", "src/chronograph/models.py"]
runner = "python3 -m unittest discover -s tests"
do_not_mutate = [
    "src/chronograph/api.py",
    "src/chronograph/cli.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["mutants", "coverage", "features"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long (soft-enforced via formatter)
    "SIM117", # nested with statements — acceptable in tests
    "B008",   # function-call-in-default (used deliberately in a few tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "SIM108",  # ternary vs if/else — tests read better with explicit if
    "B011",    # assert False — used in tearDown safety checks
]
"scripts/*" = [
    "SIM115",  # non-context-managed open — scripts have their own control flow
]

[tool.ruff.lint.isort]
known-first-party = ["chronograph"]
