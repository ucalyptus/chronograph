repos:
  - repo: local
    hooks:
      - id: compileall
        name: python compileall src tests
        entry: python3 -m compileall src tests
        language: system
        pass_filenames: false
      - id: unittest
        name: python unittest discover
        entry: bash -c "PYTHONPATH=src python3 -m unittest discover -s tests"
        language: system
        pass_filenames: false
      - id: acceptance
        name: chronograph gherkin acceptance runner
        entry: bash -c "PYTHONPATH=src python3 tests/acceptance_runner.py"
        language: system
        pass_filenames: false
      - id: boundary
        name: chronograph dep-boundary check
        entry: python3 scripts/boundary.py
        language: system
        pass_filenames: false
      - id: dry
        name: chronograph duplicate-block check
        entry: python3 scripts/dry.py
        language: system
        pass_filenames: false
